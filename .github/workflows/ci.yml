# CI —— 检查与回归防护（每次 PR、每次 main push 都跑）
# 检查项：
#   1. TypeScript 语法（与 pi 加载器同口径：Node 类型擦除）
#   2. shell 脚本语法（install.sh）
#   3. 版本号一致性（VERSION 是唯一权威：VERSION ↔ CHANGELOG ↔ 中英 README 徽章）
#   4. 结构冒烟（扩展 / 命令行 / 安装脚本都在，扩展注册了预期命令与钩子）
#   5. 单元测试（本轮 diff 的基线 / 统计 / patch 生成，node:test 直跑 TS）

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TypeScript syntax (same parser as pi's loader)
        run: node --experimental-strip-types --check turn-diff.ts

      - name: Shell script syntax
        run: bash -n install.sh

      - name: Version consistency (VERSION is the single source of truth)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          CL="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          BD_EN="$(grep -m1 -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README.md | cut -d- -f2)"
          BD_CN="$(grep -m1 -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README_cn.md | cut -d- -f2)"
          echo "VERSION=$V changelog=$CL readme.en=$BD_EN readme.cn=$BD_CN"
          [ "$V" = "$CL" ] && [ "$V" = "$BD_EN" ] && [ "$V" = "$BD_CN" ] || { echo "版本号不一致"; exit 1; }

      - name: Unit tests (baseline / report / patch)
        run: npm test

      - name: Structure smoke test
        run: |
          test -f turn-diff.ts
          test -x install.sh
          test -x scripts/turn-diff
          grep -q 'registerCommand("turn-diff"' turn-diff.ts
          grep -q 'registerEntryRenderer' turn-diff.ts
          grep -q 'before_agent_start' turn-diff.ts
          grep -q 'agent_settled' turn-diff.ts
          python3 -c "import ast,sys; ast.parse(open('scripts/turn-diff').read())"
          bash -n install.sh
